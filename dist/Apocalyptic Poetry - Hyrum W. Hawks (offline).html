<style>
/* Hyrum W. Hawks style: space-black, Jost + Crimson Pro, Earth-blue accent, headlight-amber emphasis.
   Colors come from the Oct 26 deck restyle. */
:root{
  --bg:#050608; --bg2:rgba(20,23,29,.93); --bg3:#0d1015;
  --ink:#ecebe7; --ink2:#c9c7c1; --dim:#8e949c;
  --hi:#ffa94d;          /* headlight amber */
  --earth:#6cb4ee;       /* Earth blue */
  --brass:#e6c36a; --line:rgba(150,185,220,.17);
  --serif:"Crimson Pro","GFS Didot",Georgia,serif;
  --caps:"Jost","GFS Didot",system-ui,sans-serif;
  --greek:"GFS Didot",serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:400 20px/1.55 var(--serif);
  background:
   radial-gradient(ellipse 1200px 600px at 50% -10%, rgba(108,180,238,.08), transparent 70%),
   radial-gradient(ellipse 1400px 420px at 50% 115%, rgba(190,190,185,.06), transparent 70%),
   var(--bg);
  display:flex;flex-direction:column}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.8}
header,main,footer{position:relative;z-index:1}
a{color:var(--earth);text-decoration:none}
a:hover{color:var(--hi)}
button{font:500 15px var(--caps);letter-spacing:.06em;color:var(--ink);background:transparent;border:1px solid var(--line);
  border-radius:4px;padding:7px 14px;cursor:pointer}
button:hover,button.on{border-color:var(--earth);color:var(--earth)}
button.on{background:rgba(108,180,238,.1)}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}

/* header */
.bar{display:flex;align-items:baseline;gap:28px;padding:18px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand-name{font:500 15px var(--caps);letter-spacing:.22em;text-transform:uppercase;color:var(--ink)}
.brand-sub{font:italic 400 16px var(--serif);color:var(--dim)}
.crumbs{font:400 14px var(--caps);letter-spacing:.06em;color:var(--dim)}
.crumbs a{color:var(--dim)} .crumbs a:hover{color:var(--hi)}
.crumbs span.sep{margin:0 8px;opacity:.5}

main:focus,main:focus-visible{outline:none}
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:28px clamp(16px,4vw,48px) 64px;outline:none}
.eyebrow{font:500 13px var(--caps);letter-spacing:.28em;text-transform:uppercase;color:var(--earth);margin:0 0 8px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}
h1{font-size:clamp(34px,5vw,54px);line-height:1.1}
h2{font-size:30px}
.lede{color:var(--ink2);font-size:21px;max-width:44em}

/* home hero: the Greek spiral of JST Revelation 12 frames the title */
.hero{position:relative;width:100%;aspect-ratio:16/9;max-height:78vh;margin:0 auto 34px;}
.spiral-wrap{position:absolute;inset:0}
.hero .spiral-svg{position:absolute;inset:0;width:100%;height:100%}
.spiral-svg text{font-family:var(--greek);fill:rgba(214,222,232,.17)}
.spiral-svg .s11{fill:rgba(108,180,238,.8)}
.spiral-svg .sn{fill:rgba(255,169,77,.55)}
.hero-in{position:absolute;inset:20% 18%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero-in .pre{font:400 clamp(13px,1.6vw,18px) var(--caps);letter-spacing:.4em;text-transform:uppercase;color:var(--dim);margin:0}
.hero-in h1{font-size:clamp(30px,6vw,76px);letter-spacing:.02em;margin:.1em 0 .15em}
.hero-in .by:hover{color:var(--ink)}
.hero-in .logo img:hover{opacity:1}
.hero-in .by{font:400 clamp(12px,1.4vw,16px) var(--caps);letter-spacing:.3em;text-transform:uppercase;color:var(--hi)}
.hero-in img{width:clamp(60px,9vw,120px);opacity:.85;margin-top:clamp(8px,2vw,22px)}
.hero-cap{font:italic 15px var(--serif);color:var(--dim);text-align:center;margin:-22px 0 34px}

/* home sections */
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.sec{background:var(--bg2);border:1px solid var(--line);border-top:3px solid var(--earth);border-radius:6px;padding:24px 26px}
.sec.soon{border-top-color:var(--line);opacity:.6}
.sec h2{font-size:28px;line-height:1.15}
.sec .by{font:400 14px var(--caps);letter-spacing:.12em;color:var(--dim);margin:4px 0 12px}
.sec p.blurb{color:var(--ink2);font-size:18px;margin:0 0 14px}
.grp h3{font:500 13px var(--caps);letter-spacing:.24em;text-transform:uppercase;color:var(--hi);margin:18px 0 6px}
.items{list-style:none;margin:0;padding:0}
.items li{border-top:1px solid var(--line)}
.items a,.items .soon{display:block;padding:9px 2px;font-size:20px;line-height:1.25}
.items a{color:var(--ink)}
.items a:hover{color:var(--hi)}
.items small{display:block;font:400 13px var(--caps);letter-spacing:.06em;color:var(--dim);margin-top:2px}
.items .soon{color:var(--dim);font-style:italic}

/* section page */
.list-page .items a{font-size:24px;padding:14px 2px}

/* poem pages */
.poem{max-width:760px;margin:0 auto}
.poem-head{text-align:center;margin-bottom:34px}
.poem-head .by{font:400 14px var(--caps);letter-spacing:.28em;text-transform:uppercase;color:var(--hi);margin-top:12px}
.poem-head .intro{color:var(--dim);font-style:italic;margin-top:10px}
.toc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 40px}
.toc a{font:400 14px var(--caps);letter-spacing:.08em;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:4px 12px}
.toc a:hover{color:var(--hi);border-color:var(--hi)}
.hymn{margin:0 0 56px;text-align:center;scroll-margin-top:20px}
.hymn h2{font-size:30px;margin-bottom:16px}
.hymn h2 .num{display:block;font:500 13px var(--caps);letter-spacing:.3em;color:var(--earth);margin-bottom:4px}
.hymn p{margin:0 0 .35em;font-size:22px}
.orn{display:block;margin:0 auto 56px;width:120px;height:12px;opacity:.5}

/* two-voice poem */
.voices{display:flex;gap:8px;justify-content:center;margin:-10px 0 36px;flex-wrap:wrap}
.stanza{margin:0 0 50px}
.stanza h2{font-size:26px;text-align:center;margin-bottom:6px}
.stanza .pairnames{text-align:center;font:400 13px var(--caps);letter-spacing:.2em;text-transform:uppercase;margin-bottom:18px}
.pairnames .b{color:var(--hi)} .pairnames .c{color:var(--earth)}
.vl{margin:0;padding:3px 0;font-size:22px;transition:opacity .3s}
.vl.b{color:var(--ink)}
.vl.c{color:var(--earth);padding-left:3.2em;font-style:italic}
.only-b .vl.c,.only-c .vl.b{opacity:.12}
.legend-v{text-align:center;color:var(--dim);font-size:16px;font-style:italic;margin-top:-18px;margin-bottom:28px}

/* footer */
.foot{border-top:1px solid var(--line);padding:22px clamp(16px,4vw,48px);color:var(--dim);font:400 13px/1.5 var(--caps);letter-spacing:.03em;text-align:center}
.foot p{margin:2px 0}
.foot-mark{height:40px;opacity:.55;margin-top:10px}

@media (max-width:640px){
  body{font-size:18px}
  .hymn p,.vl{font-size:19px}
  .vl.c{padding-left:1.6em}
  .hero{aspect-ratio:auto;height:auto;max-height:none}
  .spiral-wrap{display:none}
  .hero-in{position:static;padding:30px 0 10px}
  .doors{position:static;display:grid;gap:12px;padding-bottom:10px}
  .door{position:static;width:auto}
}

/* ---------- chiasm viewer ---------- */
.cx .lede{margin:10px 0 6px}
.cx-credit{font:400 13px var(--caps);letter-spacing:.12em;color:var(--dim);margin:0 0 18px}
.arcbox{background:rgba(5,6,8,.6);border:1px solid var(--line);border-radius:6px;padding:10px 6px 4px}
#cxArcs{display:block;width:100%;height:auto}
#cxArcs .arc{fill:none;stroke:rgba(108,180,238,.55);stroke-width:1.6;transition:opacity .3s,stroke .3s}
#cxArcs .arc.dim{opacity:.12}
#cxArcs .arc.sel{stroke:var(--hi);stroke-width:3.4;opacity:1}
#cxArcs .hit{fill:none;stroke:transparent;stroke-width:9;cursor:pointer}
#cxArcs .hit:hover{stroke:rgba(255,169,77,.25)}
#cxArcs .base{stroke:rgba(205,218,232,.25);stroke-width:1}
#cxArcs .ctr{fill:var(--earth);cursor:pointer}
#cxArcs .ctr.sel{fill:var(--hi)}
#cxArcs .tick{fill:var(--dim);font:12px var(--caps);text-anchor:middle}
#cxArcs .ctrlab{fill:var(--hi);font:600 15px var(--caps);text-anchor:middle}
.bands{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 18px}
.bands button{font-size:13px;padding:5px 10px;letter-spacing:.03em}
.bands button b{color:var(--hi);font-weight:600;margin-right:3px}
.cx-tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px}
.cx-tog{margin-left:auto;font:400 14px var(--caps);color:var(--dim);display:flex;gap:6px;align-items:center;cursor:pointer}
.cx-tog input{accent-color:var(--hi)}
mark{background:rgba(255,169,77,.16);color:var(--hi);border-radius:2px;padding:0 1px}
.lab{font:600 14px var(--caps);letter-spacing:.1em;color:var(--hi)}
.ref{font:400 14px var(--caps);letter-spacing:.06em;color:var(--dim);margin-left:8px}
.jst{font:600 10px var(--caps);letter-spacing:.12em;color:var(--earth);border:1px solid rgba(108,180,238,.5);border-radius:3px;padding:0 4px;vertical-align:2px}
.wnav,.wnav2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wnav2{justify-content:center;margin-top:16px}
.where{font:400 15px var(--caps);letter-spacing:.06em;color:var(--ink2);text-align:center}
button:disabled{opacity:.3;cursor:default}
.pcard{display:grid;grid-template-columns:1fr 2px 1fr;gap:26px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:24px 26px;margin-top:14px;min-height:190px}
.pcard p{font-size:22px;margin:8px 0 0}
.hinge{background:linear-gradient(to bottom,transparent,var(--hi),transparent);opacity:.6}
.ctrcard{display:block;text-align:center;border-color:rgba(255,169,77,.5)}
.ctrcard p{font-size:26px;max-width:30em;margin:12px auto 0}
.hint{color:var(--dim);font-style:italic;font-size:16px;text-align:center;margin:10px 0}
.fold{display:flex;flex-direction:column;gap:4px}
.fband{font:500 13px var(--caps);letter-spacing:.2em;text-transform:uppercase;color:var(--earth);margin:22px 0 6px}
.frow{display:grid;grid-template-columns:1fr 2px 1fr;gap:18px;padding:10px 14px;border-radius:4px;cursor:pointer;
  margin:0 calc(var(--d) * .35%);background:rgba(20,23,29,.55);border:1px solid transparent;transition:opacity .3s}
.frow:hover{border-color:var(--line)}
.frow.sel{border-color:var(--hi);background:rgba(255,169,77,.06)}
.frow.dim{opacity:.25}
.frow p{margin:3px 0 0;font-size:18px;line-height:1.4}
.frow .ref{margin-left:4px}
.ctrrow{grid-template-columns:1fr;text-align:center;border-color:rgba(255,169,77,.4);margin-top:16px}
.ctrrow p{font-size:21px}
.cx-note{color:var(--dim);font-size:15px;margin-top:34px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:760px){
  .pcard,.frow{grid-template-columns:1fr;gap:12px}
  .hinge{height:2px;background:linear-gradient(to right,transparent,var(--hi),transparent)}
  .frow{margin:0}
  .pcard p{font-size:19px}
}

/* the four doors on the home page, set in the corners inside the spiral */
.hero{max-width:1180px}
.doors{position:absolute;inset:0;pointer-events:none}
.door{position:absolute;width:24%;height:20%;justify-content:center;pointer-events:auto;display:flex;flex-direction:column;gap:4px;
  background:var(--bg2);border:1px solid var(--line);border-top:3px solid var(--earth);border-radius:6px;
  padding:clamp(10px,1.4vw,18px) clamp(12px,1.6vw,22px);transition:border-color .2s,transform .2s,background .2s}
.door:hover{border-color:var(--hi);background:rgba(255,169,77,.07);transform:translateY(-2px)}
.door .dt{font:400 clamp(15px,1.6vw,22px)/1.15 var(--serif);color:var(--ink)}
.door .db{font:400 clamp(11px,1vw,14px) var(--caps);letter-spacing:.1em;color:var(--dim)}
.door.d1{left:6%;top:14%} .door.d2{right:6%;top:14%;text-align:right}
.door.d3{left:6%;bottom:13%} .door.d4{right:6%;bottom:13%;text-align:right}
.hero-in{inset:24% 27%}
.hero-in h1{white-space:nowrap;font-size:clamp(28px,4.6vw,62px)}

@media (max-width:640px){
  .hero{aspect-ratio:auto}
  .hero-in{position:static;inset:auto;padding:30px 0 20px}
  .hero-in h1{white-space:normal}
  .doors{position:static;display:grid;gap:12px;padding-bottom:10px}
  .door{position:static;width:auto;height:auto;text-align:left!important}
  .door .dt{font-size:22px}
}

.9 L1297.9 62.0 L1302.8 62.0 L1307.8 62.0 L1312.7 62.0 L1317.7 62.0 L1322.6 62.0 L1327.6 62.0 L1332.5 62.1 L1337.5 62.1 L1342.4 62.1 L1347.4 62.1 L1352.3 62.1 L1357.3 62.1 L1362.2 62.2 L1367.2 62.2 L1372.1 62.2 L1377.1 62.2 L1382.0 62.2 L1387.0 62.2 L1391.9 62.2 L1396.9 62.3 L1401.8 62.3 L1406.8 62.3 L1411.7 62.3 L1416.7 62.3 L1421.6 62.3 L1426.6 62.4 L1431.5 62.4 L1436.5 62.4 L1441.4 62.4 L1446.4 62.4\" fill=\"none\"/><text font-size=\"11\"><textPath href=\"#spiralPath\"><tspan class=\"sn\" font-size=\"14.5\">ιαʹ</tspan><tspan class=\"s11\" font-size=\"14.5\"> καὶ αὐτοὶ ἐνίκησαν αὐτὸν διὰ τὸ αἷμα τοῦ Ἀρνίου καὶ διὰ τὸν λόγον τῆς μαρτυρίας αὐτῶν, καὶ οὐκ ἠγάπησαν τὴν ψυχὴν αὐτῶν, ἀλλ᾽ ἐτήρησαν τὴν μαρτυρίαν ἄχρι θανάτου. διὰ τοῦτο εὐφραίνεσθε, οὐρανοί, καὶ οἱ ἐν αὐτοῖς σκηνοῦντες. </tspan><tspan class=\"sn\">ιβʹ</tspan><tspan class=\"sv\"> Καὶ μετὰ ταῦτα ἤκουσα ἄλλην φωνὴν λέγουσαν· Οὐαὶ τοῖς κατοικοῦσιν τὴν γῆν, ναὶ καὶ τοῖς κατοικοῦσιν ἐν ταῖς νήσοις τῆς θαλάσσης, ὅτι κατέβη ὁ διάβολος πρὸς ὑμᾶς ἔχων θυμὸν μέγαν, εἰδὼς ὅτι ὀλίγον καιρὸν ἔχει. </tspan><tspan class=\"sn\">ιγʹ</tspan><tspan class=\"sv\"> Καὶ ὅτε εἶδεν ὁ δράκων ὅτι ἐβλήθη εἰς τὴν γῆν, ἐδίωξεν τὴν γυναῖκα ἥτις ἔτεκεν τὸν ἄρσενα. </tspan><tspan class=\"sn\">ιδʹ</tspan><tspan class=\"sv\"> καὶ ἐδόθησαν τῇ γυναικὶ αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου, ἵνα πέτηται εἰς τὴν ἔρημον εἰς τὸν τόπον αὐτῆς, ὅπου τρέφεται ἐκεῖ καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ ἀπὸ προσώπου τοῦ ὄφεως. </tspan><tspan class=\"sn\">ιεʹ</tspan><tspan class=\"sv\"> καὶ ἔβαλεν ὁ ὄφις ἐκ τοῦ στόματος αὐτοῦ ὀπίσω τῆς γυναικὸς ὕδωρ ὡς ποταμόν, ἵνα αὐτὴν ποταμοφόρητον ποιήσῃ. </tspan><tspan class=\"sn\">ιϛʹ</tspan><tspan class=\"sv\"> καὶ ἐβοήθησεν ἡ γῆ τῇ γυναικί, καὶ ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς καὶ κατέπιεν τὸν ποταμὸν ὃν ἔβαλεν ὁ δράκων ἐκ τοῦ στόματος αὐτοῦ. </tspan><tspan class=\"sn\">ιζʹ</tspan><tspan class=\"sv\"> καὶ ὠργίσθη ὁ δράκων ἐπὶ τῇ γυναικί, καὶ ἀπῆλθεν ποιῆσαι πόλεμον μετὰ τῶν λοιπῶν τοῦ σπέρματος αὐτῆς, τῶν τηρούντων τὰς ἐντολὰς τοῦ Θεοῦ καὶ ἐχόντων τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ. </tspan><tspan class=\"sn\">αʹ</tspan><tspan class=\"sv\"> Καὶ σημεῖον μέγα ὤφθη ἐν τῷ οὐρανῷ, ἐν ὁμοιώματι τῶν ἐπὶ τῆς γῆς· γυνὴ περιβεβλημένη τὸν ἥλιον, καὶ ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς, καὶ ἐπὶ τῆς κεφαλῆς αὐτῆς στέφανος ἀστέρων δώδεκα· </tspan><tspan class=\"sn\">βʹ</tspan><tspan class=\"sv\"> καὶ ἐν γαστρὶ ἔχουσα, καὶ κράζει ὠδίνουσα καὶ βασανιζομένη τεκεῖν. </tspan><tspan class=\"sn\">γʹ</tspan><tspan class=\"sv\"> καὶ ἔτεκεν υἱὸν ἄρσεν, ὃς μέλλει ποιμαίνειν πάντα τὰ ἔθνη ἐν ῥάβδῳ σιδηρᾷ· καὶ ἡρπάσθη τὸ τέκνον αὐτῆς πρὸς τὸν Θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ. </tspan><tspan class=\"sn\">δʹ</tspan><tspan class=\"sv\"> καὶ ὤφθη ἄλλο σημεῖον ἐν τῷ οὐρανῷ, καὶ ἰδοὺ δράκων πυρρὸς μέγας ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα, καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ἑπτὰ διαδήματα· καὶ ἡ οὐρὰ αὐτοῦ σύρει τὸ τρίτον τῶν ἀστέρων τοῦ οὐρανοῦ, καὶ ἔβαλεν αὐτοὺς εἰς τὴν γῆν. καὶ ὁ δράκων ἕστηκεν ἐνώπιον τῆς γυναικὸς τῆς τεκούσης, ἕτοιμος καταφαγεῖν τὸ τέκνον αὐτῆς μετὰ τὸ γεννηθῆναι. </tspan><tspan class=\"sn\">εʹ</tspan><tspan class=\"sv\"> καὶ ἡ γυνὴ ἔφυγεν εἰς τὴν ἔρημον, ὅπου ἔχει ἐκεῖ τόπον ἡτοιμασμένον ἀπὸ τοῦ Θεοῦ, ἵνα ἐκεῖ τρέφωσιν αὐτὴν ἔτη χίλια διακόσια ἑξήκοντα. </tspan><tspan class=\"sn\">ϛʹ</tspan><tspan class=\"sv\"> Καὶ ἐγένετο πόλεμος ἐν τῷ οὐρανῷ· ὁ Μιχαὴλ καὶ οἱ ἄγγελοι αὐτοῦ τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος, καὶ ὁ δράκων ἐπολέμησεν καὶ οἱ ἄγγελοι αὐτοῦ μετὰ τοῦ Μιχαήλ· </tspan><tspan class=\"sn\">ζʹ</tspan><tspan class=\"sv\"> καὶ οὐκ ἴσχυσεν ὁ δράκων κατὰ τοῦ Μιχαήλ, οὐδὲ κατὰ τοῦ τέκνου, οὐδὲ κατὰ τῆς γυναικός, ἥτις ἐστὶν ἡ ἐκκλησία τοῦ Θεοῦ, ἡ λυθεῖσα ἐκ τῶν ὠδίνων αὐτῆς καὶ τεκοῦσα τὴν βασιλείαν τοῦ Θεοῦ ἡμῶν καὶ τοῦ Χριστοῦ αὐτοῦ. </tspan><tspan class=\"sn\">ηʹ</tspan><tspan class=\"sv\"> οὐδὲ τόπος εὑρέθη ἐν τῷ οὐρανῷ τῷ δράκοντι τῷ μεγάλῳ, ὃς ἐβλήθη, ὁ ὄφις ὁ ἀρχαῖος, ὁ καλούμενος Διάβολος καὶ ὁ Σατανᾶς, ὁ πλανῶν τὴν οἰκουμένην ὅλην· ἐβλήθη εἰς τὴν γῆν, καὶ οἱ ἄγγελοι αὐτοῦ μετ᾽ αὐτοῦ ἐβλήθησαν. </tspan><tspan class=\"sn\">θʹ</tspan><tspan class=\"sv\"> καὶ ἤκουσα φωνὴν μεγάλην ἐν τῷ οὐρανῷ λέγουσαν· Ἄρτι ἐγένετο ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία τοῦ Θεοῦ ἡμῶν καὶ ἡ ἐξουσία τοῦ Χριστοῦ αὐτοῦ, </tspan><tspan class=\"sn\">ιʹ</tspan><tspan class=\"sv\"> ὅτι ἐβλήθη ὁ κατήγωρ τῶν ἀδελφῶν ἡμῶν, ὁ κατηγορῶν αὐτοὺς ἐνώπιον τοῦ Θεοῦ ἡμῶν ἡμέρας καὶ νυκτός. </tspan></textPath></text></svg>";

</script>

<script>
/* The 70-fold chiasm viewer: folding arcs, band chips, pair-by-pair walk, and the full fold.
   Adapted from the Oct 26-28 deck code (drawArcs, BandStop, FullFold). */
window.Chiasm = (function(){
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STOP = new Set("the and of to in that his he him unto a an is was were be for with which who they them their this these those but not all as by from on upon shall will i my me thee thou thy ye you your it its have hath had are or there what when so saith said say also any no one into out up our we us her she shalt doth hast let even every after before".split(" "));
const words = t => new Set((t.toLowerCase().match(/[a-z’']+/g)||[]).map(w=>w.replace(/[’']s$/,"")).filter(w=>w.length>2&&!STOP.has(w)));
const mark = (t,sh,on) => esc(t).replace(/[A-Za-z’']+/g, w => { const k=w.toLowerCase().replace(/[’']s$/,""); return on&&sh.has(k)?`<mark>${w}</mark>`:w; });

let st = null, keyH = null, autoT = null;

function mount(el, data, startLabel){
  const P = data.pairs, NP = P.length, N = NP*2+1;
  const bandOf = p => data.bands.findIndex(b => b.members.includes(P[p].label));
  const seq = []; P.forEach(x=>seq.push(x.L.ref)); seq.push(data.center.ref); for(let p=NP-1;p>=0;p--) seq.push(P[p].R.ref);
  const start = Math.max(0, P.findIndex(x=>x.label===startLabel));
  st = {el, data, P, NP, N, bandOf, seq, pair: startLabel ? start : NP, band: null, mode: "walk", shared: true};

  el.innerHTML = `
  <div class="cx">
    <p class="eyebrow">John the Revelator's Poetry · Chiasm</p>
    <h1>The 70-Fold Chiasm</h1>
    <p class="lede">Seventy mirrored pairs in the Book of Revelation, centered on JST 12:11. Each arc joins a passage to its mirror; tap one to read the pair.</p>
    <p class="cx-credit">Chiasm identified by Hyrum W. Hawks · ${esc(data.version)}</p>
    <div class="arcbox"><svg id="cxArcs" role="img" aria-label="Arc diagram: 70 arcs joining mirrored passages across the book"></svg></div>
    <div class="bands" id="cxBands"></div>
    <div class="cx-tabs"><button data-m="walk">Pair by pair</button><button data-m="fold">The full fold</button><label class="cx-tog"><input type="checkbox" id="cxShared" checked> Mark shared words</label></div>
    <div id="cxBody"></div>
    <p class="cx-note">KJV text, with the Joseph Smith Translation where marked JST. Chapter 12 follows JST verse numbers. Shared words are found by simple word matching, leaving out common words.</p>
  </div>`;

  el.querySelector("#cxBands").innerHTML = `<button data-b="-1" class="on">All bands</button>` +
    data.bands.map((b,i)=>`<button data-b="${i}"><b>${i+1}</b> ${esc(b.name)}</button>`).join("");
  el.querySelectorAll("#cxBands button").forEach(b => b.onclick = () => {
    const i = +b.dataset.b; st.band = i<0 ? null : i;
    if(st.band!=null && st.mode==="walk"){ const first = P.findIndex(x=>x.label===data.bands[i].members[0]); st.pair = first; }
    render();
    if(st.band!=null && st.mode==="fold"){ const r = el.querySelector(`.frow[data-b="${i}"]`); if(r) r.scrollIntoView({behavior:"smooth",block:"center"}); }
  });
  el.querySelectorAll(".cx-tabs button").forEach(b => b.onclick = () => { st.mode = b.dataset.m; stopAuto(); render(); });
  el.querySelector("#cxShared").onchange = e => { st.shared = e.target.checked; render(); };

  keyH = e => {
    if(e.target.closest && e.target.closest("input,textarea")) return;
    if(e.key==="ArrowRight"||e.key==="ArrowDown"&&st.mode==="walk"){ go(st.pair+1); e.preventDefault(); }
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp"&&st.mode==="walk"){ go(st.pair-1); e.preventDefault(); }
  };
  document.addEventListener("keydown", keyH);
  window.addEventListener("resize", drawArcs);
  render();
}

function go(p){ st.pair = Math.max(0, Math.min(st.NP, p)); render(); }

function drawArcs(){
  if(!st) return;
  const svg = st.el.querySelector("#cxArcs"); if(!svg) return;
  const {N, NP, seq, P} = st;
  const W = Math.max(600, svg.clientWidth || 1000), H = Math.round(W*0.36), pad = 14, y0 = H-30;
  const dx = (W-2*pad)/(N-1), X = i => pad+i*dx, k = (y0-10)/((N-1)/2*dx);
  let s = "";
  for(let p=0;p<NP;p++){
    const x1=X(p), x2=X(N-1-p), rx=(x2-x1)/2, ry=rx*k, b=st.bandOf(p);
    const sel = p===st.pair, dimmed = st.band!=null && b!==st.band;
    const d = `M${x1.toFixed(1)} ${y0} A${rx.toFixed(1)} ${ry.toFixed(1)} 0 0 1 ${x2.toFixed(1)} ${y0}`;
    s += `<path d="${d}" class="arc${sel?" sel":""}${dimmed?" dim":""}"/>`;
    s += `<path d="${d}" class="hit" data-p="${p}"><title>${esc(P[p].label)} · ${esc(P[p].L.ref)} ↔ ${esc(P[p].R.ref)}</title></path>`;
  }
  s += `<line x1="${pad}" y1="${y0}" x2="${W-pad}" y2="${y0}" class="base"/>`;
  s += `<circle cx="${X(NP)}" cy="${y0}" r="6" class="ctr${st.pair===NP?" sel":""}" data-p="${NP}"/>`;
  let last = "", lastX = -99, gap = W<900 ? 22 : 16;
  seq.forEach((r,i) => { const ch = r.split(":")[0]; if(ch!==last){ last = ch; if(X(i)-lastX>=gap){ lastX = X(i); s += `<text x="${X(i).toFixed(1)}" y="${y0+20}" class="tick">${ch}</text>`; } } });
  s += `<text x="${X(NP)}" y="${y0-14}" class="ctrlab">12:11</text>`;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.innerHTML = s;
  svg.querySelectorAll("[data-p]").forEach(a => a.onclick = () => { if(st.mode==="fold"){ st.mode="walk"; } go(+a.dataset.p); });
}

function srcTag(x){ return x.src==="JST" || (x.ref.startsWith("12:")) ? ` <span class="jst">JST</span>` : ""; }

function render(){
  const {el, P, NP, data} = st;
  el.querySelectorAll(".cx-tabs button").forEach(b => b.classList.toggle("on", b.dataset.m===st.mode));
  el.querySelectorAll("#cxBands button").forEach(b => b.classList.toggle("on", (+b.dataset.b) === (st.band==null?-1:st.band)));
  drawArcs();
  const body = el.querySelector("#cxBody");
  if(st.mode==="walk"){
    const p = st.pair;
    let card;
    if(p===NP){
      const c = data.center;
      card = `<div class="pcard ctrcard"><span class="lab">${esc(c.label)} · the center</span><span class="ref">${esc(c.ref)} <span class="jst">JST</span></span><p>${esc(c.text)}</p></div>`;
    } else {
      const x = P[p], sh = new Set([...words(x.L.text)].filter(w=>words(x.R.text).has(w)));
      card = `<div class="pcard"><div class="half"><span class="lab">${esc(x.label)}</span><span class="ref">${esc(x.L.ref)}${srcTag(x.L)}</span><p>${mark(x.L.text,sh,st.shared)}</p></div>
        <div class="hinge" aria-hidden="true"></div>
        <div class="half"><span class="lab">${esc(x.label)}′</span><span class="ref">${esc(x.R.ref)}${srcTag(x.R)}</span><p>${mark(x.R.text,sh,st.shared)}</p></div></div>`;
    }
    const b = p<NP ? st.bandOf(p) : -1;
    const where = p<NP ? `Pair ${p+1} of ${NP} · Band ${b+1}: ${esc(data.bands[b].name)}` : `The center`;
    body.innerHTML = `<div class="walk">
      <div class="wnav"><button id="wOut" ${p===0?"disabled":""}>← Outward</button><span class="where">${where}</span><button id="wIn" ${p===NP?"disabled":""}>Inward →</button></div>
      ${card}
      <div class="wnav2"><button id="wStart">Start at the edge</button><button id="wCtr">Go to the center</button><button id="wAuto">${autoT?"Stop":"Auto-walk"}</button></div>
      <p class="hint">Use the arrow keys, or tap any arc.</p></div>`;
    body.querySelector("#wOut").onclick = () => go(p-1);
    body.querySelector("#wIn").onclick = () => go(p+1);
    body.querySelector("#wStart").onclick = () => go(0);
    body.querySelector("#wCtr").onclick = () => go(NP);
    body.querySelector("#wAuto").onclick = () => { if(autoT) stopAuto(); else { autoT = setInterval(()=>{ if(st.pair>=NP) stopAuto(); else go(st.pair+1); }, 6000); } render(); };
    history.replaceState(null, "", "#/chiasm/" + (p<NP ? P[p].label : ""));
  } else {
    let h = "";
    for(let p=0;p<NP;p++){
      const x = P[p], sh = new Set([...words(x.L.text)].filter(w=>words(x.R.text).has(w))), b = st.bandOf(p);
      const depth = Math.min(p, 40);
      if(p===0 || st.bandOf(p-1)!==b) h += `<div class="fband" data-b="${b}">Band ${b+1} · ${esc(data.bands[b].name)}</div>`;
      h += `<div class="frow${p===st.pair?" sel":""}${st.band!=null&&b!==st.band?" dim":""}" data-p="${p}" data-b="${b}" style="--d:${depth}">
        <div class="half"><span class="lab">${esc(x.label)}</span> <span class="ref">${esc(x.L.ref)}${srcTag(x.L)}</span><p>${mark(x.L.text,sh,st.shared)}</p></div>
        <div class="hinge" aria-hidden="true"></div>
        <div class="half"><span class="lab">${esc(x.label)}′</span> <span class="ref">${esc(x.R.ref)}${srcTag(x.R)}</span><p>${mark(x.R.text,sh,st.shared)}</p></div></div>`;
    }
    const c = data.center;
    h += `<div class="frow ctrrow${st.pair===NP?" sel":""}" data-p="${NP}" style="--d:40"><div class="half"><span class="lab">${esc(c.label)} · the center</span> <span class="ref">${esc(c.ref)} <span class="jst">JST</span></span><p>${esc(c.text)}</p></div></div>`;
    body.innerHTML = `<p class="hint">Read down the left column into the center, then back up the right. Each row is a mirrored pair.</p><div class="fold">${h}</div>`;
    body.querySelectorAll(".frow").forEach(r => r.onclick = () => { st.pair = +r.dataset.p; body.querySelectorAll(".frow").forEach(x=>x.classList.toggle("sel",x===r)); drawArcs(); });
    history.replaceState(null, "", "#/chiasm");
  }
}

function stopAuto(){ if(autoT){ clearInterval(autoT); autoT = null; } }
function teardown(){ stopAuto(); if(keyH) document.removeEventListener("keydown", keyH); window.removeEventListener("resize", drawArcs); keyH = null; st = null; }

return {mount, teardown};
})();

</script>

function setTheme(s){ document.body.className = s && s.theme ? "theme-" + s.theme : ""; }
const FRAMES = { hebrew: () => D.spiralHebrewSVG, greek: () => D.spiralSVG };
const FRAME_NOTE = { hebrew: "The border is Genesis 1 in paleo-Hebrew letters (Westminster Leningrad Codex consonants), read right to left, spiraling in from 1:1.",
                     greek: "The border is Revelation 12 in Greek, in Joseph Smith Translation order, spiraling in from 12:11." };
function section(id){
  const s = C.sections.find(x => x.id===id); if(!s) return notFound();
  crumbs([["Home",""],[s.title,""]]);
  document.title = s.title + " · Hyrum W. Hawks";
  setTheme(s);
  if(s.frame){
    app.innerHTML = `<section class="hero framed"><div class="spiral-wrap" title="${esc(FRAME_NOTE[s.frame])}">${FRAMES[s.frame]()}</div>
      <div class="hero-in frame-in">${s.byline?`<p class="eyebrow">${esc(s.byline)}</p>`:""}<h1>${esc(s.title)}</h1>
      ${s.groups.map(g => `<div class="grp">${g.title?`<h3>${esc(g.title)}</h3>`:""}${itemsHTML(g.items)}</div>`).join("")}</div></section>`;
    return;
  }
  app.innerHTML = `<div class="list-page"><p class="eyebrow">${esc(s.byline)}</p><h1>${esc(s.title)}</h1>${s.blurb?`<p class="lede">${esc(s.blurb)}</p>`:""}
   ${s.groups.map(g => `<div class="grp">${g.title?`<h3>${esc(g.title)}</h3>`:""}${itemsHTML(g.items)}</div>`).join("")}</div>`;
}

function sectionOf(route){
  for(const s of C.sections) for(const g of s.groups) for(const it of g.items) if(it.route===route) return s;
  return null;
}
const ORN = `<svg class="orn" viewBox="0 0 120 12" aria-hidden="true"><path d="M0 6H48M72 6H120" stroke="#6cb4ee" stroke-width="1"/><circle cx="60" cy="6" r="3" fill="#ffa94d"/><circle cx="52" cy="6" r="1.3" fill="#6cb4ee"/><circle cx="68" cy="6" r="1.3" fill="#6cb4ee"/></svg>`;

function poem(id){
  const P = (D.poems||{})[id]; if(!P) return notFound();
  const s = sectionOf("poem/"+id);
  setTheme(s);
  crumbs([["Home",""], s?[s.title,"section/"+s.id]:["Poems",""], [P.title,""]]);
  document.title = P.title + " · Hyrum W. Hawks";
  const head = `<div class="poem-head"><p class="eyebrow">${P.kind==="hymns"?"Hymns":"Poem"}</p><h1>${esc(P.title)}</h1><div class="by">${esc(P.author)}</div>${P.intro?`<p class="intro">${esc(P.intro)}</p>`:""}</div>`;
  if(P.kind==="hymns"){
    app.innerHTML = `<article class="poem">${head}
      <nav class="toc">${P.sections.map(x=>`<a href="#/poem/${id}/${x.n}">${x.n}. ${esc(x.title)}</a>`).join("")}</nav>
      ${P.sections.map(x=>`<section class="hymn" id="h${x.n}"><h2><span class="num">${x.n}</span>${esc(x.title)}</h2>${x.lines.map(l=>`<p>${esc(l)}</p>`).join("")}</section>${ORN}`).join("")}
    </article>`;
  } else if(P.kind==="two-voice"){
    app.innerHTML = `<article class="poem" id="tv">${head}
      <div class="voices"><button class="on" data-v="">Both voices</button><button data-v="only-b">Blessings</button><button data-v="only-c">Consequences</button></div>
      ${P.stanzas.map(st=>{const [b,c]=st.title.replace(/^Beatitude of /,"").split(/ vs /i);
        return `<section class="stanza"><h2>${esc(st.title)}</h2><div class="pairnames"><span class="b">${esc(b||"")}</span> · <span class="c">${esc(c||"")}</span></div>
        ${st.lines.map((l,i)=>`<p class="vl ${i%2?"c":"b"}">${esc(l)}</p>`).join("")}</section>`;}).join(ORN)}
    </article>`;
    const tv = $("#tv");
    tv.querySelectorAll(".voices button").forEach(b => b.onclick = () => {
      tv.classList.remove("only-b","only-c"); if(b.dataset.v) tv.classList.add(b.dataset.v);
      tv.querySelectorAll(".voices button").forEach(x=>x.classList.toggle("on",x===b)); });
  }
}

function notFound(){ crumbs([["Home",""],["Not found",""]]); app.innerHTML = `<h1>Not found</h1><p class="lede"><a href="#/">Return home</a></p>`; }

function route(){
  const h = location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  window.scrollTo(0,0);
  if(window.Chiasm) Chiasm.teardown();
  document.body.className = "";
  if(!h.length) home();
  else if(h[0]==="section") section(h[1]);
  else if(h[0]==="poem"){ poem(h[1]); if(h[2]){ const el=document.getElementById("h"+h[2]); if(el) el.scrollIntoView(); } }
  else if(h[0]==="chiasm"){ const s=sectionOf("chiasm"); crumbs([["Home",""],[s.title,"section/"+s.id],["The 70-Fold Chiasm",""]]);
    document.title = "The 70-Fold Chiasm of Revelation · Hyrum W. Hawks"; Chiasm.mount(app, D.chiasm70, h[1]); }
  else notFound();
  app.focus({preventScroll:true});
}
window.addEventListener("hashchange", route);
route();
})();

</script>
